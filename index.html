<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="bkg-section">
        <div class="logo-bkg-container">
            <img src="assets/images/odin-lined.png" alt="odin logo">
            <p id="logo-text">ODIN</p>
        </div>
        <div class="bkg-footer-container"> 
            <p>Photo by <a href="https://unsplash.com/@haliewestphoto" rel="noreferrer noopener" target="_blank">Halle West</a> on <a href="https://unsplash.com/" rel="noreferrer noopener" target="_blank">Unsplash</a></p>
        </div>
    </section>
    <section class="form-section">
        <div class="form-title-container">
            <p id="title-announcer">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
            <p id="title-hook">You <em>know</em> you want to.</p>
        </div>
        <form>
            <div class="form-input-container">
                <h2>Let's do this!</h2>
                <title>Let's do this!</title>
                <div class="input-container">
                    <div>
                        <label for="fname">FIRST NAME</label>
                        <br>
                        <input type="text" name="fname" id="fname">
                    </div>
                    <div>
                        <label for="lname">LAST NAME</label>
                        <br>
                        <input type="text" name="lname" id="lname">
                    </div>
                </div>
                <div class="input-container">
                    <div>
                        <label for="email">EMAIL</label>
                        <br>
                        <input type="email" name="email" id="email">
                    </div>
                    <div>
                        <label for="phone">PHONE NUMBER</label>
                        <br>
                        <input type="tel" name="phone" id="phone">
                    </div>
                </div>
                <div class="input-container">
                    <div>
                        <label for="pwd">PASSWORD</label>
                        <br>
                        <input type="password" name="pwd" id="pwd" required minlength="3" maxlength="25">
                    </div>
                    <div>
                        <label for="confirm-pwd">CONFIRM PASSWORD</label>
                        <br>
                        <input type="password" name="confirm-pwd" id="confirm-pwd" required minlength="3" maxlength="25">
                    </div>
                </div>
            </div>
            <div class="form-footer">
                <button>Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </form>
    </section>
</body>
</html>
